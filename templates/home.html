<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Fair Value Calculator - Home</title>
    <style>
        a {
            color: #80DEEA;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #2B2B2B;
            color: #EAEAEA;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            margin-top: 100px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #3C3C3C;
            color: #EAEAEA;
            border: 1px solid #7B6D8D;
            border-radius: 4px;
        }

        button {
            margin-top: 10px;
            padding: 10px 15px;
            width: 100%;
            background-color: #593F62;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7B6D8D;
        }

        .footer {
            margin-top: auto;
            width: 100%;
            text-align: center;
            padding: 10px;
            background: #593F62;
            color: #fff;
            font-size: 0.85em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><p>Enter in a <a href="{{ url_for('glossary') }}#term-Stock-Ticker">stock ticker</a> to begin estimating the stock's <a href="{{ url_for('glossary') }}#term-Fair-Value">stock's fair value</a>.</p></h1>
        <form method="POST">
            <input type="text" name="stockTicker" placeholder="For example: AAPL" required>
            <button type="submit">Search</button>
        </form>
    </div>
    <div class="footer">
        <p>Mills & Tikhomirov - Stock Fair Value Calculator - Spring 2025 Capstone Project</p>
    </div>
</body>
</html>
