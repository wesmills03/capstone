<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glossary - Stock Terms</title>
    <style>
        .highlight {
            background-color: #ffeb3b;
            transition: background-color 2s ease-out;
        }

        .term {
            scroll-margin-block: 120 px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #555;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2B2B2B;
            color: #EAEAEA;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 80px auto 40px;
            background-color: #3C3C3C;
            padding: 20px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            color: #88c7e6;
        }

        .term {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #555;
        }

        .term h3 {
            margin: 0;
            color: #A5C4D4;
        }

        .term p {
            margin: 5px 0 0;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            padding: 10px;
            background: #593F62;
            color: #fff;
            font-size: 0.85em;
            margin-top: auto;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #593F62;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            z-index: 1000;
        }

        .top-bar form {
            margin: 0;
            flex: 1;
        }

        .top-bar input[type="text"] {
        width: 50%;
        padding: 6px;
        background-color: #3C3C3C;
        color: #EAEAEA;
        border: none;
        border-radius: 4px;
        }

        .top-bar button {
            margin-left: 10px;
            background-color: #A5C4D4;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .navigation {
            text-align: center;
            margin-top: 20px;
        }

        .navigation a {
            color: #A5C4D4;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>

<body>
    <div class="top-bar">
        <form method="POST" action="{{ url_for('stock_details') }}">
            <input type="text" name="stockTicker" placeholder="Enter Stock Ticker" required>
            <button type="submit">Go</button>
        </form>
        <nav>
            <a href="{{ url_for('home') }}" style="color:white; margin-right:15px;">Home</a>
            <a href="{{ url_for('glossary') }}" style="color:white; margin-right:15px;">Glossary</a>
        </nav>
    </div>

    <div class="container">
        <h1><b>Glossary</b></h1>
        {% for term, definition in glossary_terms.items() %}
        
        <div 
            class="term"
            id="term-{{ term|replace(' ', '-') }}"
        >
            <h3>{{ term }}</h3>
            <p>{{ definition }}</p>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        <p>Mills & Tikhomirov - Stock Fair Value Calculator - Spring 2025 Capstone Project</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (!hash) return;

            const el = document.querySelector(hash);
            if (!el) return;

            el.scrollIntoView({ behavior: 'smooth', block: 'start' });

            el.classList.add('highlight');
            setTimeout(() => el.classList.remove('highlight'), 5000);
        })
    </script>
</body>
</html>
